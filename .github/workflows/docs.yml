name: Deploy docs
on:
  push:
    branches:
      - main
      - pr/** # just for testing
  # Releases are tagged through the GitHub API, which does not trigger
  # workflows, so release.yml calls this with the tag rather than relying on a
  # `tags:` trigger.
  workflow_call:
    inputs:
      ref:
        description: 'Tag to build the docs for. Defaults to the triggering ref.'
        type: string
        default: ''
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
            ref: ${{ inputs.ref }}
      - run: echo ref_name=${{ inputs.ref || github.ref_name }} >> $GITHUB_ENV
      - run: echo docs_dir=docs-build/${{ env.ref_name }} >> $GITHUB_ENV
      - run: echo documentation directory=${{ env.docs_dir }}
      - uses: jdx/mise-action@v4
      - run: mise install rust mdbook cargo:mdbook-variables github:badboy/mdbook-mermaid
      - run: mkdir -p ${{ env.docs_dir }}
      - run: |
          export GITHUB_REF_NAME=${{ env.ref_name }}
          cd docs
          mise x -- mdbook build -d ../${{ env.docs_dir }}/book
      - run: mise x -- cargo doc --workspace --no-deps
      - run: mv target/doc ${{ env.docs_dir }}/api
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: docs-build
          CLEAN: false
